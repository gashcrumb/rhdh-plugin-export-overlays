name: Plugin Update CI Bridge

# Listens for CI workflow completions (Pull Request Actions, Run Workspace Smoke Tests)
# on PRs labeled workspace-update, and invokes the Fullsend plugin-update agent directly
# via reusable-dispatch with a pre-computed matrix.

on:
  workflow_run:
    workflows:
      - "Pull Request Actions"
      - "Workspace Smoke Tests"
      - "Run Plugin Smoke Tests"
    types:
      - completed

permissions: {}

jobs:
  prepare:
    name: Prepare Bridge Matrix
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      should_trigger: ${{ steps.resolve.outputs.should_trigger }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve Target PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_LIST_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail
          echo "Processing completion of '${WORKFLOW_NAME}' (conclusion: ${RUN_CONCLUSION})..."

          PR_NUM=""
          # 1. Try from workflow_run payload pull_requests
          if [[ -n "${PR_LIST_JSON}" && "${PR_LIST_JSON}" != "[]" && "${PR_LIST_JSON}" != "null" ]]; then
            PR_NUM=$(echo "${PR_LIST_JSON}" | jq -r '.[0].number // empty')
          fi

          # 2. Match open PRs by title or head branch
          if [[ -z "${PR_NUM}" ]]; then
            PR_NUM=$(gh pr list --repo "${REPO}" --state open --json number,title,headRefName \
              --jq ".[] | select(.title == \"${DISPLAY_TITLE}\" or .headRefName == \"${HEAD_BRANCH}\") | .number" | head -1 || true)
          fi

          if [[ -z "${PR_NUM}" ]]; then
            echo "::notice::No matching open PR found for workflow run — skipping bridge trigger"
            echo "should_trigger=false" >> "${GITHUB_OUTPUT}"
            echo "matrix={\"include\":[]}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 3. Verify PR has workspace-update label
          HAS_LABEL=$(gh pr view "${PR_NUM}" --repo "${REPO}" --json labels \
            --jq '.labels[] | select(.name == "workspace-update") | .name' 2>/dev/null || true)

          if [[ -z "${HAS_LABEL}" ]]; then
            echo "::notice::PR #${PR_NUM} does not have 'workspace-update' label — skipping bridge trigger"
            echo "should_trigger=false" >> "${GITHUB_OUTPUT}"
            echo "matrix={\"include\":[]}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # 4. If Pull Request Actions completed with success and dispatched smoke tests,
          # wait for Workspace Smoke Tests to complete before invoking Fullsend.
          # (GitHub suppresses workflow_run for runs dispatched by GITHUB_TOKEN, so we wait here).
          if [[ "${WORKFLOW_NAME}" == "Pull Request Actions" ]]; then
            SMOKE_DISPATCHED=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
              --jq '.jobs[] | select(.name == "Trigger Smoke Tests" and .conclusion == "success") | .name' 2>/dev/null || true)
            if [[ -n "${SMOKE_DISPATCHED}" ]]; then
              echo "Publish succeeded and dispatched smoke tests — waiting for Workspace Smoke Tests to complete..."
              # Wait up to 10 minutes for smoke test workflow to complete (typically ~1.5 - 2 mins)
              for i in {1..120}; do
                SMOKE_RUN=$(gh run list --repo "${REPO}" --workflow "workspace-tests.yaml" --limit 1 \
                  --json status,conclusion,createdAt --jq '.[0]' 2>/dev/null || echo "{}")
                STATUS=$(echo "${SMOKE_RUN}" | jq -r '.status // empty')
                CONCLUSION=$(echo "${SMOKE_RUN}" | jq -r '.conclusion // empty')
                
                if [[ "${STATUS}" == "completed" ]]; then
                  echo "Workspace Smoke Tests completed with conclusion: ${CONCLUSION}"
                  # Brief pause to ensure comment is persisted in GitHub PR API
                  sleep 5
                  break
                fi
                echo "[DEBUG] Waiting for Workspace Smoke Tests (status: ${STATUS:-queued})... (${i}/120)"
                sleep 5
              done
            fi
          fi

          PR_DATA=$(gh pr view "${PR_NUM}" --repo "${REPO}" --json number,url,headRefOid,baseRefName)
          PR_URL=$(echo "${PR_DATA}" | jq -r '.url')
          PR_HEAD_SHA=$(echo "${PR_DATA}" | jq -r '.headRefOid')
          PR_BASE_REF=$(echo "${PR_DATA}" | jq -r '.baseRefName')

          PAYLOAD=$(jq -nc \
            --arg pr_num "${PR_NUM}" \
            --arg url "${PR_URL}" \
            --arg head_sha "${PR_HEAD_SHA}" \
            --arg base_ref "${PR_BASE_REF}" \
            '{
              issue: { number: ($pr_num | tonumber), html_url: $url },
              pull_request: {
                number: ($pr_num | tonumber),
                html_url: $url,
                head: { sha: $head_sha },
                base: { ref: $base_ref }
              }
            }')

          MATRIX=$(jq -nc \
            --arg repo "${REPO}" \
            --arg pr_num "${PR_NUM}" \
            --arg payload "${PAYLOAD}" \
            '{
              include: [
                {
                  agent: "plugin-update",
                  role: "coder",
                  source_repo: $repo,
                  status_repo: $repo,
                  status_number: ($pr_num | tonumber),
                  event_payload: $payload
                }
              ]
            }')

          echo "Target PR identified: #${PR_NUM} (${PR_URL})"
          echo "should_trigger=true" >> "${GITHUB_OUTPUT}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  dispatch:
    name: Fullsend Dispatch
    needs: [prepare]
    if: needs.prepare.outputs.should_trigger == 'true'
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@84c8bbbb821ff85136854150b06740253709b3b8
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
