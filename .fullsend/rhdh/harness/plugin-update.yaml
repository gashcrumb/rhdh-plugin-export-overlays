---
# harness/plugin-update.yaml — Automated plugin update PR handler agent.
#
# Flow: sandbox (agent) → post_script
#   agent       : analyzes PR state, evaluates publish/smoke/e2e CI, applies workspace metadata/env remediations, and emits directives
#   post_script : executes PR comments (slash commands), commits workspace fixes if any, and updates labels
#
# The agent operates within a single affected workspace and never runs local image builds.
agent: rhdh/agents/plugin-update.md
model: haiku
image: ghcr.io/redhat-developer/rhdh-fullsend-code:latest
policy: rhdh/policies/plugin-update.yaml

role: coder
slug: fullsend-ai-coder

trigger: >
  (
    (event.entity.kind == "change_proposal" && (event.transition.kind == "opened" || event.transition.kind == "synchronized"))
    || (event.transition.kind == "label_changed" && event.transition.label.name == "workspace-update" && event.transition.label.action == "added")
    || (event.transition.kind == "comment_added" && (
        (has(event.transition.comment.command) && event.transition.comment.command == "/fs-plugin-update")
        || (
            (event.transition.comment.body.contains("Publish workflow") || event.transition.comment.body.contains("Action 'publish'") || event.transition.comment.body.contains("Action 'smoketest'") || event.transition.comment.body.contains("Action 'override-backstage'"))
            && !event.transition.comment.body.contains("<!-- fullsend:")
           )
       ))
  )
  && "workspace-update" in event.state.labels

host_files:
  - src: /tmp/workspace/pr-input.json
    dest: /sandbox/workspace/pr-input.json
    optional: true
  - src: rhdh/env/rhdh-toolchain.env
    dest: /sandbox/workspace/.env.d/rhdh-toolchain.env
  - src: rhdh/env/yarn-proxy.env
    dest: /sandbox/workspace/.env.d/yarn-proxy.env
  - src: rhdh/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
    optional: true
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /tmp/.gcp-oidc-token
    optional: true

skills:
  - skills/e2e-failure-analysis
  - skills/playwright-trace
  - skills/plugin-pr-triage
  - skills/metadata-remediation

pre_script: rhdh/scripts/pre-plugin-update.sh
post_script: rhdh/scripts/post-plugin-update.sh

validation_loop:
  script: rhdh/scripts/validate-output-schema.sh
  max_iterations: 2

env:
  runner:
    GH_TOKEN: ${GH_TOKEN}
    REPO_FULL_NAME: redhat-developer/rhdh-plugin-export-overlays
    GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
    FULLSEND_OUTPUT_SCHEMA: ${FULLSEND_DIR}/rhdh/schemas/plugin-update-result.schema.json
  sandbox:
    CLAUDE_CODE_USE_VERTEX: "1"
    ANTHROPIC_VERTEX_PROJECT_ID: "${ANTHROPIC_VERTEX_PROJECT_ID}"
    CLOUD_ML_REGION: "global"
    VERTEX_LOCATION: "global"
    GOOGLE_APPLICATION_CREDENTIALS: "/tmp/.gcp-credentials.json"
    SKILL_DIR: /sandbox/claude-config/skills/e2e-failure-analysis
    PLAYWRIGHT_BROWSERS_PATH: /tmp/playwright-browsers
    GH_TOKEN: "${GH_TOKEN}"
    GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
    REPO_FULL_NAME: redhat-developer/rhdh-plugin-export-overlays

timeout_minutes: 45

forge:
  github:
    env:
      runner:
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
      sandbox:
        REPO_FULL_NAME: "${REPO_FULL_NAME}"
        GH_TOKEN: "${GH_TOKEN}"
        GITHUB_ISSUE_URL: "${GITHUB_ISSUE_URL}"
